<!DOCTYPE html>

<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#217346"
  />

  <title>
    Giáo Trình Microsoft Excel
  </title>


  <!-- =====================================================
       OFFICE JS
  ====================================================== -->

  <script
    type="text/javascript"
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
  ></script>

</head>



<body>


  <!-- =====================================================
       LOADING
  ====================================================== -->

  <section
    id="sideload-msg"
    class="loading-screen"
  >

    <div class="loading-card">


      <div class="loading-logo">

        X

      </div>


      <div class="loading-info">

        <strong>
          GIÁO TRÌNH EXCEL
        </strong>

        <span>
          Đang tải dữ liệu...
        </span>

      </div>


      <div
        class="loading-spinner"
        aria-hidden="true"
      ></div>


    </div>

  </section>



  <!-- =====================================================
       APP
  ====================================================== -->

  <main
    id="app-body"
    class="app"
    style="display: none;"
  >


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="app-header">


      <!-- DECORATION -->

      <div
        class="header-decoration header-decoration-one"
      ></div>

      <div
        class="header-decoration header-decoration-two"
      ></div>



      <!-- BRAND -->

      <div class="header-brand">

        <div class="header-logo">
          X
        </div>

        <div class="header-brand-text">

          <strong class="header-title">
            GIÁO TRÌNH EXCEL
          </strong>

          <span class="header-subtitle">
            Học và tra cứu ngay trong Excel
          </span>

        </div>

      </div>


    </header>



    <!-- ===================================================
         LEARNING AREA
    ==================================================== -->

    <div id="learning-area">


      <!-- HERO / INTRO -->

      <section class="intro-section">

        <h1 class="intro-title">
          HỌC MICROSOFT EXCEL
        </h1>

        <p class="intro-description">
          Giáo trình Microsoft Excel từ cơ bản đến nâng cao, tra cứu nhanh
          ngay trong Task Pane — thao tác, ví dụ, phím tắt và bài thực hành.
        </p>

      </section>



      <!-- SEARCH -->

      <section class="search-section">

        <div class="search-box">

          <span class="search-icon" aria-hidden="true">
            🔍
          </span>

          <input
            id="search"
            type="text"
            class="search-input"
            placeholder="Tìm bài học, hàm Excel, phím tắt... (VD: SUM, Ctrl + S, Freeze Panes)"
            autocomplete="off"
          />

          <button
            id="clear-search"
            type="button"
            class="search-clear-button"
            aria-label="Xoá tìm kiếm"
          >
            ✕
          </button>

        </div>

      </section>



      <!-- HOME VIEW -->

      <section
        id="home-view"
        class="home-view"
      >

        <div id="search-result-info"></div>

        <div
          id="lesson-groups"
          class="lesson-groups"
        ></div>

      </section>



      <!-- LESSON VIEW -->

      <section
        id="lesson-view"
        class="lesson-view"
        style="display: none;"
      >

        <button
          id="back-button"
          type="button"
          class="back-button"
        >
          ← Quay lại danh sách bài học
        </button>


        <header class="lesson-header">

          <div class="lesson-header-top">

            <span
              id="lesson-part"
              class="lesson-part-badge"
            ></span>

            <span
              id="lesson-level"
              class="lesson-level-badge"
            ></span>

          </div>

          <h2
            id="lesson-title"
            class="lesson-title"
          ></h2>

          <p
            id="lesson-description"
            class="lesson-description"
          ></p>

        </header>


        <div
          id="lesson-content"
          class="lesson-content"
        ></div>


        <button
          id="back-button-bottom"
          type="button"
          class="back-button back-button-bottom"
        >
          ← Quay lại danh sách bài học
        </button>

      </section>


    </div>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="app-footer">

      <span>
        Giáo Trình Excel — Từ cơ bản đến nâng cao
      </span>

    </footer>


  </main>


</body>

</html>
